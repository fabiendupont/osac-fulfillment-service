syntax = "proto3";

package osac.private.v1;

// Binds a catalog item to an Ansible collection and ResourceAction for provisioning dispatch.
// The operator reads this metadata to determine which AAP Job Template to invoke.
message ProvisioningMetadata {
  // Ansible collection that contains the provisioning roles (e.g., "osac.compute_kubevirt", "netris.osac").
  // This is the Galaxy-compatible namespace.collection identifier.
  string collection = 1;

  // Resource action prefix within the collection (e.g., "instance", "cluster", "virtual_network").
  // The operator derives the full role name by appending the event and phase:
  // <resource_action>.<event>.main (e.g., "instance.create.main").
  string resource_action = 2;
}
